services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: political_site
      POSTGRES_PASSWORD: political_site
      POSTGRES_DB: political_site
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U political_site"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://political_site:political_site@postgres:5432/political_site
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
